<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="post">
        <div class="post-header">
            <div class="header-left">
                    <i class="fa-brands fa-html5 fa-2x"></i>
                <div class="post-title">
                    <p class="title">HTML</p>
                    <p class="username">Rigoberto</p>
                </div>
            </div>
            
            <div class="bar-icon">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>

        </div>
        <div class="post-photo">
            <img src="/rainy nigth.jpg" alt="">
        </div>
        <div class="post-interaction">
            <div class="interaction-icons">
                <i class="fa-regular fa-heart fa-lg"></i>
                <i class="fa-regular fa-comment fa-lg"></i>
                <i class="fa-regular fa-paper-plane fa-lg"></i>
            </div>
            <div class="save-icon">
                <i class="fa-regular fa-bookmark fa-lg"></i>
            </div>
        </div>
        <div class="post-body">
            <p class="likes">Liked by <strong>4geeks</strong> and <strong>100.000 others</strong></p>
            <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fusce porta tempus turpis, vitae facilisis velit vehicula vitae.
            Cras massa turpis, vulputate eget tortor at, ullamcorper tempus est. Integer condimentum tellus.
            </p>
        </div>
    </div>
</body>
</html>
